org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

mod_version=0.2.0
maven_group=dev.hearthgate

# WebAssembly runtime
chicory_version=1.7.5

# Fabric. The mod is compiled against the oldest supported Minecraft version
# and declares compatibility with 26.1 through 26.3; see fabric/build.gradle
# for compiling and running against the others.
minecraft_version=26.1
loader_version=0.20.1
loom_version=1.19.4


# Fabric API build per supported Minecraft version (-Pmc=<version> selects one).
fabric_api_26.1=0.145.1+26.1
fabric_api_26.1.1=0.145.4+26.1.1
fabric_api_26.1.2=0.155.3+26.1.2
fabric_api_26.2=0.161.0+26.2
fabric_api_26.3=0.166.2+26.3

# NeoForge build per supported Minecraft version (-Pmc=<version> selects one).
neoforge_26.1=26.1.0.19-beta
neoforge_26.1.1=26.1.1.15-beta
neoforge_26.1.2=26.1.2.126
neoforge_26.2=26.2.0.93
neoforge_26.3=26.3.0.103

# Minecraft Forge build per supported Minecraft version (-Pmc=<version> selects one).
forge_26.1=26.1-62.0.9
forge_26.1.1=26.1.1-63.0.2
forge_26.1.2=26.1.2-64.1.6
forge_26.2=26.2-65.1.6
