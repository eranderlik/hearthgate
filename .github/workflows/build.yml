name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-go@v6
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - uses: gradle/actions/setup-gradle@v5

      - name: Go tests (native)
        working-directory: helper
        run: go vet ./... && go test ./...

      - name: Build and test
        # Network tests talk to Tailcat's public relays from two in-JVM helpers.
        # Both ends of each tunnel share this 4-vCPU runner, like two 2-core
        # machines, so run the helper the way such machines do (JitPolicy).
        run: ./gradlew build -PnetworkTests -PhelperJit=c1

      - name: Check the 26.1-built jar links against every supported version
        run: tools/check-linkage.sh

      - uses: actions/upload-artifact@v5
        with:
          name: hearthgate
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar

  # The optional native helper add-on for dedicated servers, built on a runner
  # of each platform so that no cross-compilers are needed. Linux builds on
  # the oldest supported Ubuntu so the library runs on glibc 2.34 and later.
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
          - platform: windows-x86_64
            runner: windows-2022 # has MinGW-w64 gcc for cgo
          - platform: macos-aarch64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-go@v6
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - uses: gradle/actions/setup-gradle@v5
      - name: Native helper tests on ${{ matrix.platform }}
        # Loads the library into a JVM, runs it, and moves data through
        # Tailcat's relays with it.
        run: >-
          ./gradlew :core:test -PtestNative -PnetworkTests -PnativePlatform=${{ matrix.platform }}
          --tests '*NativeHelpersTest' --tests '*EndToEndTest.nativeHostNativeJoin'
      - name: Package the add-on
        run: ./gradlew :fabric:nativeAddonJar -PnativePlatform=${{ matrix.platform }}
      - uses: actions/upload-artifact@v5
        with:
          name: hearthgate-native-${{ matrix.platform }}
          path: fabric/build/libs/hearthgate-native-*.jar

  gametest:
    needs: build
    runs-on: ubuntu-latest
    # A passing run takes about 4 minutes. If the game can't open a window
    # it hangs rather than exits, so don't let that eat the 6-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.1", "26.1.1", "26.1.2", "26.2", "26.3"]
        native: [false]
        include:
          # The dedicated server test again, with the native add-on installed.
          - mc: "26.3"
            native: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-go@v6
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - uses: gradle/actions/setup-gradle@v5
      # Mesa's software EGL and Vulkan drivers (llvmpipe, lavapipe), so 26.3's
      # renderer has a working OpenGL path and a Vulkan fallback.
      - run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libegl-mesa0 mesa-vulkan-drivers
      - name: In-game test on Minecraft ${{ matrix.mc }}${{ matrix.native && ' (native helper)' || '' }}
        # 26.3 opens its window through SDL3 instead of GLFW. Over GLX, SDL3
        # finds no matching visual on the runner's Mesa ("Couldn't find
        # matching GLX visual"), so have it create the context through EGL.
        # GLFW (26.1-26.2) ignores this. xvfb-run's default screen is only 8
        # bits deep, hence the explicit 24-bit screen.
        env:
          SDL_VIDEO_FORCE_EGL: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :fabric:runClientGameTest -Pmc=${{ matrix.mc }} ${{ matrix.native && '-PgametestNative' || '' }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots-${{ matrix.mc }}${{ matrix.native && '-native' || '' }}
          path: fabric/build/run/clientGameTest/screenshots/

  # The NeoForge jar is built against the oldest version; each run builds it
  # once, then starts a dedicated server of every supported version with that
  # jar in its mods folder and checks that Hearthgate comes up and hands out an
  # invitation (tools/server-smoke.sh).
  neoforge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.1", "26.1.1", "26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-go@v6
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :neoforge:jar
      - run: cp neoforge/build/libs/hearthgate-neoforge-*.jar "$RUNNER_TEMP/hearthgate-neoforge-built.jar"
      - name: Dedicated server smoke test on Minecraft ${{ matrix.mc }}
        run: tools/server-smoke.sh :neoforge:runServer neoforge/run/server -Pmc=${{ matrix.mc }} -PprebuiltJar="$RUNNER_TEMP/hearthgate-neoforge-built.jar"
      - name: Check the 26.1-built jar links against every supported NeoForge
        if: matrix.mc == '26.1'
        run: tools/check-linkage-neoforge.sh
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: neoforge-smoke-${{ matrix.mc }}
          path: neoforge/run/server/smoke.log
